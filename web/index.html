<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS GAME</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="titlebar">
    <span class="dot" id="dot"></span>
    <div class="promptwrap">
      <button class="attach" id="btn-image" type="button" title="Anexar imagem — fundo ou textura do jogo atual"
              aria-label="Anexar imagem — fundo ou textura do jogo atual" aria-controls="imagefile">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="3" y="4" width="18" height="16" rx="3"></rect>
          <circle cx="9" cy="9.5" r="1.6"></circle>
          <path d="M4 17l5-5 4 4 3-3 4 4"></path>
        </svg>
      </button>
      <input id="prompt" class="prompt" type="text" placeholder="Ex: jogo de nave, desenhe um castelo, logo neon, oi"
             autocomplete="off" spellcheck="false">
      <button class="reset" id="btn-reset" type="button" title="Reiniciar sessão"
              aria-label="Reiniciar sessão">↺</button>
      <div class="imgattach" id="imgattach" hidden>
        <img class="imgthumb" id="imgthumb" alt="Miniatura da imagem anexada">
        <div class="imgmeta">
          <span class="imgname" id="imgname"></span>
          <span class="imgsub" id="imgsub"></span>
          <span class="imgstate" id="imgstate"></span>
        </div>
        <button class="imgx" id="img-remove" type="button" title="Remover imagem"
                aria-label="Remover imagem anexada">✕</button>
      </div>
      <input id="imagefile" type="file" accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp" hidden>
    </div>
    <span class="libs" id="libs" hidden></span>
    <span class="status" id="status"></span>
    <canvas id="vu" class="vu" width="200" height="48"></canvas>
    <span class="kblabel" id="kb" hidden>…</span>
    <button class="hbtn" id="btn-edit" type="button" title="Editar elementos da página">✎ EDITAR</button>
    <button class="hbtn" id="btn-finalize" type="button" style="display:none">✔ FINALIZAR</button>
    <button class="hbtn" id="btn-save" type="button">SALVAR</button>
    <button class="hbtn" id="btn-open" type="button">ABRIR</button>
    <button class="hbtn" id="btn-usage" type="button" aria-expanded="false" aria-controls="usage">CONSUMO</button>
    <button id="btn-gear" class="iconbtn gear" type="button" title="Configurações" aria-label="Configurações">⚙</button>
  </div>
</header>
<div class="usage" id="usage" hidden>
  <div class="usage-head">
    <span class="usage-title">CONSUMO</span>
    <button class="mx-x" id="usage-close" type="button" aria-label="Fechar">✕</button>
  </div>
  <div class="usage-model" id="usage-model">sem API key</div>
  <div class="usage-bar"><div class="usage-fill" id="usage-fill"></div></div>
  <div class="usage-session" id="usage-session">↑0 ↓0 · 0/1M</div>
  <div class="usage-sec">Histórico</div>
  <div class="usage-stats" id="usage-stats"></div>
</div>
<main class="stage">
  <iframe id="frame" class="frame" title="Página gerada"
          allow="fullscreen; autoplay"
          sandbox="allow-scripts allow-pointer-lock allow-popups allow-modals"></iframe>
  <div id="nx-preview" class="nx-preview" hidden>⚡ prévia ao vivo</div>
</main>
<script src="js/themes.js"></script>
<script src="js/prefs.js"></script>
<script src="js/library-selector.js"></script>
<script src="js/html-builder.js"></script>
<script src="js/nx-image.js"></script>
<script src="js/ai-client.js"></script>
<script src="js/store.js"></script>
<script src="js/vu-meter.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
