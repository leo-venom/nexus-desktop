<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS GAME</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="titlebar">
    <h1 class="brand" id="brand">NEXUS GAME</h1>
    <span class="dot" id="dot"></span>
    <div class="promptwrap">
      <input id="prompt" class="prompt" type="text" placeholder="Ex: jogo de nave com tiro, tetris neon, plataforma com lava"
             autocomplete="off" spellcheck="false">
      <button class="reset" id="btn-reset" type="button" title="Reiniciar sessão"
              aria-label="Reiniciar sessão">↺</button>
    </div>
    <span class="status" id="status"></span>
    <canvas id="vu" class="vu" width="54" height="20"></canvas>
    <span class="kblabel" id="kb" hidden>…</span>
    <button class="hbtn" id="btn-edit" type="button" title="Editar elementos da página">✎ EDITAR</button>
    <button class="hbtn" id="btn-finalize" type="button" style="display:none">✔ FINALIZAR</button>
    <button class="hbtn" id="btn-save" type="button">SALVAR</button>
    <button class="hbtn" id="btn-open" type="button">ABRIR</button>
    <button class="hbtn" id="btn-usage" type="button" aria-expanded="false" aria-controls="usage">CONSUMO</button>
    <button id="btn-gear" class="iconbtn gear" type="button" title="Configurações" aria-label="Configurações">⚙</button>
  </div>
</header>
<div class="usage" id="usage" hidden>
  <div class="usage-head">
    <span class="usage-title">CONSUMO</span>
    <button class="mx-x" id="usage-close" type="button" aria-label="Fechar">✕</button>
  </div>
  <div class="usage-model" id="usage-model">sem API key</div>
  <div class="usage-bar"><div class="usage-fill" id="usage-fill"></div></div>
  <div class="usage-session" id="usage-session">↑0 ↓0 · 0/1M</div>
  <div class="usage-sec">Histórico</div>
  <div class="usage-stats" id="usage-stats"></div>
</div>
<main class="stage">
  <iframe id="frame" class="frame" title="Página gerada"
          allow="fullscreen; pointer-lock; keyboard-lock; autoplay"
          sandbox="allow-scripts allow-pointer-lock allow-popups"></iframe>
</main>
<script src="js/themes.js"></script>
<script src="js/prefs.js"></script>
<script src="js/html-builder.js"></script>
<script src="js/ai-client.js"></script>
<script src="js/store.js"></script>
<script src="js/vu-meter.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
