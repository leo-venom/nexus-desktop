<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>NxTex — 88 texturas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;background:#0a0a0f;color:#e0e0e0;font-family:system-ui,sans-serif}
body{padding:20px}
h1{font-size:18px;margin-bottom:16px;color:#00E88A}
h1 small{font-size:13px;color:#888;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.item{text-align:center;font-size:10px;color:#aaa}
.item img{display:block;margin:0 auto 4px;border:1px solid #222;border-radius:4px;width:80px;height:80px;image-rendering:pixelated}
.leg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
</style>
</head>
<body>
<h1>NxTex · <span id="count">0</span> texturas procedurais<small>  (data URL via NxTex)</small></h1>
<div class="grid" id="grid"></div>
<script src="js/nx-textures.js"></script>
<script>
(function(){
  var grid = document.getElementById('grid');
  var nomes = window.NxTex.names();
  document.getElementById('count').textContent = nomes.length;
  nomes.forEach(function(n){
    var div = document.createElement('div');
    div.className = 'item';
    var c = window.NxTex.canvas(n, 128);
    var img = document.createElement('img');
    img.src = c.toDataURL();
    img.alt = n;
    div.appendChild(img);
    var leg = document.createElement('div');
    leg.className = 'leg';
    leg.textContent = n.replace(/_/g,' ');
    div.appendChild(leg);
    grid.appendChild(div);
  });
})();
</script>
</body>
</html>
