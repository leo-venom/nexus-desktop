<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gelatina</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

body {
  background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f1e 100%);
  position: fixed;
  inset: 0;
}

#container {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  touch-action: none;
}
</style>
</head>
<body>
<div id="container"></div>

<script src="vendor/three/three.min.js"></script>
<script>
(function() {
  'use strict';

  const container = document.getElementById('container');
  let W = container.clientWidth;
  let H = container.clientHeight;

  // Gerador de geometria de gel (superelipsoide arredondado)
  function gelGeo(sx, sy, sz, opts) {
    opts = opts || {};
    const seg = opts.seg || 18;
    const n = opts.n || 2.8;
    const inchar = opts.inchar || 1.0;
    
    const geo = new THREE.SphereGeometry(1, seg, seg);
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      v.normalize();
      
      const ax = Math.abs(v.x);
      const ay = Math.abs(v.y);
      const az = Math.abs(v.z);
      
      const r = Math.pow(
        Math.pow(ax, n) + Math.pow(ay, n) + Math.pow(az, n),
        -1/n
      ) * inchar;
      
      v.multiplyScalar(r);
      v.x *= sx * 0.5;
      v.y *= sy * 0.5;
      v.z *= sz * 0.5;
      
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    
    geo.computeVertexNormals();
    return geo;
  }

  // Material de gel
  function gelMat(color) {
    return new THREE.MeshPhysicalMaterial({
      color: color,
      transmission: 0.95,
      thickness: 1.1,
      roughness: 0.08,
      metalness: 0,
      clearcoat: 0.4,
      clearcoatRoughness: 0.2,
      ior: 1.36,
      reflectivity: 0.5,
      attenuationDistance: 2.5,
      attenuationColor: new THREE.Color(color).multiplyScalar(0.8),
      side: THREE.FrontSide,
      transparent: true,
      depthWrite: false
    });
  }

  // Renderer
  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false,
    powerPreference: 'high-performance',
    stencil: false
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(W, H, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  container.appendChild(renderer.domElement);

  // Cena
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x1a1a2e, 8, 20);

  // Câmera
  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
  camera.position.set(0, 2, 6);
  camera.lookAt(0, 0, 0);

  // Environment barato
  const envScene = new THREE.Scene();
  const envGeo = new THREE.SphereGeometry(50, 16, 16);
  const envMat = new THREE.MeshBasicMaterial({
    side: THREE.BackSide,
    color: 0x2a2a4e
  });
  envScene.add(new THREE.Mesh(envGeo, envMat));
  
  const light1 = new THREE.Mesh(
    new THREE.BoxGeometry(4, 4, 0.1),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  light1.position.set(0, 10, -10);
  envScene.add(light1);
  
  const light2 = new THREE.Mesh(
    new THREE.BoxGeometry(2, 2, 0.1),
    new THREE.MeshBasicMaterial({ color: 0x6688ff })
  );
  light2.position.set(-8, 5, 5);
  envScene.add(light2);

  const pmremGen = new THREE.PMREMGenerator(renderer);
  scene.environment = pmremGen.fromScene(envScene, 0.04).texture;
  pmremGen.dispose();
  envGeo.dispose();
  envMat.dispose();

  // Luzes
  const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
  keyLight.position.set(4, 8, 6);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.width = 1024;
  keyLight.shadow.mapSize.height = 1024;
  keyLight.shadow.camera.left = -5;
  keyLight.shadow.camera.right = 5;
  keyLight.shadow.camera.top = 5;
  keyLight.shadow.camera.bottom = -5;
  keyLight.shadow.camera.near = 0.5;
  keyLight.shadow.camera.far = 20;
  keyLight.shadow.bias = -0.0005;
  keyLight.shadow.normalBias = 0.02;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x88bbff, 0.5);
  fillLight.position.set(-5, 3, -3);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0x66ffcc, 0.9);
  rimLight.position.set(-2, 1, -6);
  scene.add(rimLight);

  const ambientLight = new THREE.AmbientLight(0x334466, 0.3);
  scene.add(ambientLight);

  // Gelatina
  const gelGroup = new THREE.Group();
  scene.add(gelGroup);

  const gelGeometry = gelGeo(1.8, 1.8, 1.8, { seg: 20, n: 2.8, inchar: 0.85 });
  const gelMaterial = gelMat(0x66ffaa);
  const gelMesh = new THREE.Mesh(gelGeometry, gelMaterial);
  gelMesh.renderOrder = -1;
  gelGroup.add(gelMesh);

  // Conteúdo interno: pequenas esferas flutuantes
  const contentGeo = new THREE.SphereGeometry(0.08, 8, 8);
  const contentMat = new THREE.MeshStandardMaterial({
    color: 0xffdd66,
    roughness: 0.3,
    metalness: 0.6
  });

  const contents = [];
  for (let i = 0; i < 8; i++) {
    const sphere = new THREE.Mesh(contentGeo, contentMat);
    const angle = (i / 8) * Math.PI * 2;
    const radius = 0.4 + Math.random() * 0.3;
    sphere.position.set(
      Math.cos(angle) * radius,
      (Math.random() - 0.5) * 0.6,
      Math.sin(angle) * radius
    );
    sphere.castShadow = true;
    sphere.userData.offset = Math.random() * Math.PI * 2;
    sphere.userData.speed = 0.3 + Math.random() * 0.4;
    sphere.userData.radius = radius;
    sphere.userData.angle = angle;
    contents.push(sphere);
    gelGroup.add(sphere);
  }

  // Plano de sombra de contato
  const shadowCanvas = document.createElement('canvas');
  shadowCanvas.width = 128;
  shadowCanvas.height = 128;
  const sctx = shadowCanvas.getContext('2d');
  const grad = sctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(0,0,0,0.4)');
  grad.addColorStop(0.5, 'rgba(0,0,0,0.2)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  sctx.fillStyle = grad;
  sctx.fillRect(0, 0, 128, 128);
  
  const shadowTex = new THREE.CanvasTexture(shadowCanvas);
  const shadowPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(3, 3),
    new THREE.MeshBasicMaterial({
      map: shadowTex,
      transparent: true,
      opacity: 0.6,
      blending: THREE.MultiplyBlending,
      depthWrite: false
    })
  );
  shadowPlane.rotation.x = -Math.PI / 2;
  shadowPlane.position.y = -1.2;
  scene.add(shadowPlane);

  // Controle de câmera
  let isDragging = false;
  let prevX = 0, prevY = 0;
  let cameraAngleX = 0;
  let cameraAngleY = Math.PI * 0.15;
  const cameraDistance = 6;

  function updateCameraPosition() {
    camera.position.x = Math.sin(cameraAngleX) * Math.cos(cameraAngleY) * cameraDistance;
    camera.position.y = Math.sin(cameraAngleY) * cameraDistance;
    camera.position.z = Math.cos(cameraAngleX) * Math.cos(cameraAngleY) * cameraDistance;
    camera.lookAt(0, 0, 0);
  }

  container.addEventListener('pointerdown', (e) => {
    isDragging = true;
    prevX = e.clientX;
    prevY = e.clientY;
  });

  container.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - prevX;
    const dy = e.clientY - prevY;
    cameraAngleX += dx * 0.005;
    cameraAngleY = Math.max(-Math.PI * 0.45, Math.min(Math.PI * 0.45, cameraAngleY + dy * 0.005));
    prevX = e.clientX;
    prevY = e.clientY;
    updateCameraPosition();
  });

  container.addEventListener('pointerup', () => {
    isDragging = false;
  });

  container.addEventListener('pointercancel', () => {
    isDragging = false;
  });

  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    const newDist = Math.max(3, Math.min(10, cameraDistance + e.deltaY * 0.01));
    camera.position.multiplyScalar(newDist / cameraDistance);
  }, { passive: false });

  // Resize
  let resizeTimeout;
  function onResize() {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      W = container.clientWidth;
      H = container.clientHeight;
      camera.aspect = W / H;
      camera.updateProjectionMatrix();
      renderer.setSize(W, H, false);
    }, 100);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  // Loop de animação
  const clock = new THREE.Clock();
  let time = 0;

  function animate() {
    requestAnimationFrame(animate);
    
    const dt = Math.min(clock.getDelta(), 0.25);
    time += dt;

    // Wobble da gelatina
    const wobbleX = 1 + 0.05 * Math.sin(time * 5.5);
    const wobbleY = 1 - 0.05 * Math.sin(time * 5.5);
    const wobbleZ = 1 + 0.04 * Math.cos(time * 4.8);
    gelMesh.scale.set(wobbleX, wobbleY, wobbleZ);

    // Rotação suave
    gelGroup.rotation.y = time * 0.15;

    // Movimento das partículas internas
    contents.forEach((sphere) => {
      const t = time * sphere.userData.speed + sphere.userData.offset;
      sphere.position.y = Math.sin(t * 1.2) * 0.3;
      const newAngle = sphere.userData.angle + time * 0.2;
      sphere.position.x = Math.cos(newAngle) * sphere.userData.radius * (1 + Math.sin(t) * 0.1);
      sphere.position.z = Math.sin(newAngle) * sphere.userData.radius * (1 + Math.sin(t) * 0.1);
    });

    // Pulsação da luz rim
    rimLight.intensity = 0.8 + 0.2 * Math.sin(time * 2);

    renderer.render(scene, camera);
  }

  // Visibilidade
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clock.stop();
    } else {
      clock.start();
      clock.getDelta();
    }
  });

  updateCameraPosition();
  animate();

  // Cleanup
  window.addEventListener('beforeunload', () => {
    gelGeometry.dispose();
    gelMaterial.dispose();
    contentGeo.dispose();
    contentMat.dispose();
    shadowTex.dispose();
    renderer.dispose();
  });
})();
</script>
</body>
</html>
