<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cubo Gelatinoso</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: linear-gradient(135deg, #0a0e1a 0%, #1a1f2e 50%, #0f1419 100%);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  touch-action: none;
}

#canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: block;
}

.info {
  position: fixed;
  bottom: max(env(safe-area-inset-bottom), 24px);
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255, 255, 255, 0.6);
  font-size: clamp(11px, 2.5vmin, 14px);
  text-align: center;
  pointer-events: none;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  padding: 0 16px;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="info">Arraste para girar • Role para aproximar</div>

<script src="vendor/three/three.min.js"></script>
<script>
// ============================================================
// NEXUS GAME — Cubo Gelatinoso
// ============================================================

const canvas = document.getElementById('canvas');
let W = window.innerWidth;
let H = window.innerHeight;

// ============================================================
// RENDERER & SCENE
// ============================================================
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'high-performance',
  alpha: false,
  stencil: false,
  depth: true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0d1116, 8, 20);

// ============================================================
// CAMERA
// ============================================================
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 100);
camera.position.set(4, 3, 5);
camera.lookAt(0, 0, 0);

// ============================================================
// PMREM ENVIRONMENT (barato)
// ============================================================
function createEnvironment() {
  const envScene = new THREE.Scene();
  
  // Esfera invertida com gradiente
  const sphereGeo = new THREE.SphereGeometry(50, 16, 8);
  const sphereMat = new THREE.MeshBasicMaterial({
    side: THREE.BackSide,
    color: 0x1a2a3a
  });
  const sphere = new THREE.Mesh(sphereGeo, sphereMat);
  envScene.add(sphere);
  
  // Caixas emissivas para reflexos
  const boxGeo = new THREE.BoxGeometry(4, 4, 4);
  
  const box1Mat = new THREE.MeshBasicMaterial({ color: 0x4488ff });
  const box1 = new THREE.Mesh(boxGeo, box1Mat);
  box1.position.set(-10, 5, -10);
  envScene.add(box1);
  
  const box2Mat = new THREE.MeshBasicMaterial({ color: 0x88ffff });
  const box2 = new THREE.Mesh(boxGeo, box2Mat);
  box2.position.set(10, 5, 10);
  envScene.add(box2);
  
  const box3Mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const box3 = new THREE.Mesh(boxGeo, box3Mat);
  box3.position.set(0, 15, 0);
  envScene.add(box3);
  
  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  const envMap = pmremGenerator.fromScene(envScene, 0.04).texture;
  
  pmremGenerator.dispose();
  sphereGeo.dispose();
  sphereMat.dispose();
  boxGeo.dispose();
  box1Mat.dispose();
  box2Mat.dispose();
  box3Mat.dispose();
  
  return envMap;
}

scene.environment = createEnvironment();

// ============================================================
// LIGHTS
// ============================================================
const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
keyLight.position.set(5, 8, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 1024;
keyLight.shadow.mapSize.height = 1024;
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -6;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 20;
keyLight.shadow.bias = -0.0005;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x88ccff, 0.5);
fillLight.position.set(-4, 3, -3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x66ffcc, 0.8);
rimLight.position.set(-2, 2, -5);
scene.add(rimLight);

const ambientLight = new THREE.AmbientLight(0x334455, 0.3);
scene.add(ambientLight);

// ============================================================
// GEOMETRIA DE GELATINA (superelipsoide arredondado)
// ============================================================
function createGelGeometry(w, h, d, segments = 16, n = 2.5) {
  const geo = new THREE.BufferGeometry();
  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];
  
  const seg = segments;
  
  for (let i = 0; i <= seg; i++) {
    const u = i / seg;
    const theta = u * Math.PI * 2;
    
    for (let j = 0; j <= seg; j++) {
      const v = j / seg;
      const phi = (v - 0.5) * Math.PI;
      
      const cosPhi = Math.cos(phi);
      const sinPhi = Math.sin(phi);
      const cosTheta = Math.cos(theta);
      const sinTheta = Math.sin(theta);
      
      const signCosPhi = cosPhi >= 0 ? 1 : -1;
      const signSinPhi = sinPhi >= 0 ? 1 : -1;
      const signCosTheta = cosTheta >= 0 ? 1 : -1;
      const signSinTheta = sinTheta >= 0 ? 1 : -1;
      
      const x = signCosTheta * Math.pow(Math.abs(cosTheta), 2 / n) * signCosPhi * Math.pow(Math.abs(cosPhi), 2 / n) * w / 2;
      const y = signSinPhi * Math.pow(Math.abs(sinPhi), 2 / n) * h / 2;
      const z = signSinTheta * Math.pow(Math.abs(sinTheta), 2 / n) * signCosPhi * Math.pow(Math.abs(cosPhi), 2 / n) * d / 2;
      
      positions.push(x, y, z);
      
      const nx = signCosTheta * Math.pow(Math.abs(cosTheta), 2 / n) * signCosPhi * Math.pow(Math.abs(cosPhi), 2 / n);
      const ny = signSinPhi * Math.pow(Math.abs(sinPhi), 2 / n);
      const nz = signSinTheta * Math.pow(Math.abs(sinTheta), 2 / n) * signCosPhi * Math.pow(Math.abs(cosPhi), 2 / n);
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      normals.push(nx / len, ny / len, nz / len);
      
      uvs.push(u, v);
    }
  }
  
  for (let i = 0; i < seg; i++) {
    for (let j = 0; j < seg; j++) {
      const a = i * (seg + 1) + j;
      const b = a + seg + 1;
      const c = a + 1;
      const d = b + 1;
      
      indices.push(a, b, c);
      indices.push(b, d, c);
    }
  }
  
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  
  return geo;
}

// ============================================================
// MATERIAL DE GELATINA
// ============================================================
const gelGeo = createGelGeometry(1.8, 1.8, 1.8, 18, 2.8);

const gelMat = new THREE.MeshPhysicalMaterial({
  color: 0x66ffcc,
  transmission: 0.95,
  thickness: 1.1,
  roughness: 0.08,
  metalness: 0,
  ior: 1.36,
  clearcoat: 0.4,
  clearcoatRoughness: 0.1,
  transparent: true,
  side: THREE.FrontSide,
  depthWrite: false,
  attenuationDistance: 2.5,
  attenuationColor: new THREE.Color(0x66ffcc)
});

const gelCube = new THREE.Mesh(gelGeo, gelMat);
gelCube.castShadow = true;
gelCube.receiveShadow = true;
gelCube.renderOrder = -1;
scene.add(gelCube);

// ============================================================
// CONTEÚDO INTERNO (osso suspenso)
// ============================================================
const boneGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.9, 8);
const boneMat = new THREE.MeshStandardMaterial({
  color: 0xeeddcc,
  roughness: 0.6,
  metalness: 0
});

const bone = new THREE.Mesh(boneGeo, boneMat);
bone.rotation.z = Math.PI / 2;
bone.castShadow = true;
gelCube.add(bone);

const sphereGeo = new THREE.SphereGeometry(0.12, 8, 8);
const sphere1 = new THREE.Mesh(sphereGeo, boneMat);
sphere1.position.x = -0.45;
sphere1.castShadow = true;
bone.add(sphere1);

const sphere2 = new THREE.Mesh(sphereGeo, boneMat);
sphere2.position.x = 0.45;
sphere2.castShadow = true;
bone.add(sphere2);

// ============================================================
// PLANO DE SOMBRA (contact shadow)
// ============================================================
const shadowCanvas = document.createElement('canvas');
shadowCanvas.width = 128;
shadowCanvas.height = 128;
const shadowCtx = shadowCanvas.getContext('2d');
const gradient = shadowCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
gradient.addColorStop(0, 'rgba(0,0,0,0.4)');
gradient.addColorStop(0.5, 'rgba(0,0,0,0.2)');
gradient.addColorStop(1, 'rgba(0,0,0,0)');
shadowCtx.fillStyle = gradient;
shadowCtx.fillRect(0, 0, 128, 128);

const shadowTexture = new THREE.CanvasTexture(shadowCanvas);
const planeMat = new THREE.MeshBasicMaterial({
  map: shadowTexture,
  transparent: true,
  opacity: 0.8,
  depthWrite: false,
  blending: THREE.MultiplyBlending
});

const planeGeo = new THREE.PlaneGeometry(3, 3);
const plane = new THREE.Mesh(planeGeo, planeMat);
plane.rotation.x = -Math.PI / 2;
plane.position.y = -1.2;
scene.add(plane);

// Chão que recebe sombra real
const floorGeo = new THREE.PlaneGeometry(20, 20);
const floorMat = new THREE.ShadowMaterial({ opacity: 0.3 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.2;
floor.receiveShadow = true;
scene.add(floor);

// ============================================================
// CONTROLES DE CÂMERA (manual)
// ============================================================
let isDragging = false;
let previousPointer = { x: 0, y: 0 };
let cameraAngleX = 0.6;
let cameraAngleY = 0.8;
let cameraDistance = 7;

function updateCameraPosition() {
  camera.position.x = cameraDistance * Math.sin(cameraAngleY) * Math.cos(cameraAngleX);
  camera.position.y = cameraDistance * Math.sin(cameraAngleX);
  camera.position.z = cameraDistance * Math.cos(cameraAngleY) * Math.cos(cameraAngleX);
  camera.lookAt(0, 0, 0);
}

canvas.addEventListener('pointerdown', (e) => {
  isDragging = true;
  previousPointer.x = e.clientX;
  previousPointer.y = e.clientY;
});

window.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  
  const deltaX = e.clientX - previousPointer.x;
  const deltaY = e.clientY - previousPointer.y;
  
  cameraAngleY += deltaX * 0.005;
  cameraAngleX += deltaY * 0.005;
  
  cameraAngleX = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, cameraAngleX));
  
  previousPointer.x = e.clientX;
  previousPointer.y = e.clientY;
  
  updateCameraPosition();
});

window.addEventListener('pointerup', () => {
  isDragging = false;
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  cameraDistance += e.deltaY * 0.01;
  cameraDistance = Math.max(3, Math.min(12, cameraDistance));
  updateCameraPosition();
}, { passive: false });

updateCameraPosition();

// ============================================================
// RESIZE
// ============================================================
function onResize() {
  W = window.innerWidth;
  H = window.innerHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H, false);
}

window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

// ============================================================
// ANIMATION LOOP
// ============================================================
const clock = new THREE.Clock();
let accumulatedTime = 0;

function animate() {
  requestAnimationFrame(animate);
  
  const dt = Math.min(clock.getDelta(), 0.25);
  accumulatedTime += dt;
  
  // Wobble de gelatina (squash & stretch)
  const t = accumulatedTime;
  const wobbleX = 1 + 0.05 * Math.sin(t * 6);
  const wobbleY = 1 - 0.05 * Math.sin(t * 6);
  const wobbleZ = 1 + 0.04 * Math.cos(t * 5);
  gelCube.scale.set(wobbleX, wobbleY, wobbleZ);
  
  // Rotação suave do conteúdo interno
  bone.rotation.y = t * 0.3;
  
  // Pulsação sutil do emissive (vida)
  const pulse = 0.6 + 0.4 * Math.sin(t * 2);
  
  renderer.render(scene, camera);
}

// ============================================================
// VISIBILITY CHANGE
// ============================================================
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clock.stop();
  } else {
    clock.start();
    clock.getDelta();
  }
});

// ============================================================
// START
// ============================================================
animate();
</script>
</body>
</html>
