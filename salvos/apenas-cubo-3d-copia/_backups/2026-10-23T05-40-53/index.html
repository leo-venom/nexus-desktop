<html lang="pt-BR">
<head><base href="/_api/saves/apenas-cubo-3d/">
<script>
/* ============================================================
 * nx-textures.js — PACK DE TEXTURAS PROCEDURAIS do NEXUS GAME (v1.5.0)
 *
 * Biblioteca pronta para os jogos gerados. Cada textura é desenhada
 * uma única vez num canvas em cache e reutilizada (pattern / canvas).
 *
 * Famílias: NEON (luz própria, halo 20px), ULTRA-BRILHANTES (piano preto,
 * plásticos coloridos, vidro), RUGOSAS (lixa, feltro, camurça, gesso, argila,
 * cortiça, juta, velcro, borracha fosca), e mais.
 *
 * API (global `NxTex`):
 *   NxTex.names()                     -> array com todos os nomes
 *   NxTex.canvas(nome, tam)           -> HTMLCanvasElement (cache)
 *   NxTex.pattern(ctx, nome, tam)     -> CanvasPattern (cache por ctx)
 *   NxTex.bloco(ctx,x,y,w,h,nome)     -> pinta bloco com textura + luz/sombra
 *   NxTex.css(nome)                   -> 'url(dataURL)' para background
 *   NxTex.three(nome)                 -> THREE.CanvasTexture (se THREE existir)
 *   NxTex.normal(nome)                -> THREE.CanvasTexture (normal map)
 *   NxTex.pbr(nome)                   -> {cor, normal, roughness, metalness}
 *   NxTex.brilhanteMat(cor)           -> THREE.MeshPhysicalMaterial (clearcoat)
 *   NxTex.vidroMat(cor)               -> THREE.MeshPhysicalMaterial (transmission)
 *   NxTex.foscoMat(cor)               -> THREE.MeshStandardMaterial (roughness .92)
 *   NxTex.aleatoria()                 -> nome sorteado
 *
 * Sem dependências. Funciona em iframe sandbox (origem opaca).
 * ============================================================ */
(function () {
  'use strict';

  if (window.NxTex) return;

  var CACHE = {};       /* nome -> canvas */
  var PATTERNS = [];    /* {ctx, nome, pat} */
  var TAM = 128;

  /* ---------- utilidades de desenho ---------- */
  function novo(tam) {
    var c = document.createElement('canvas');
    c.width = c.height = tam || TAM;
    return c;
  }

  function ruido(x, tam, alpha, escuro) {
    for (var i = 0; i < tam * tam * 0.45; i++) {
      var a = Math.random() * alpha;
      var v = Math.floor(Math.random() * 90);
      x.fillStyle = escuro
        ? 'rgba(0,0,0,' + a.toFixed(3) + ')'
        : 'rgba(' + (170 + v) + ',' + (170 + v) + ',' + (170 + v) + ',' + a.toFixed(3) + ')';
      x.fillRect(Math.random() * tam | 0, Math.random() * tam | 0, 1, 1);
    }
  }

  function grad(x, tam, stops, vertical) {
    var g = vertical === false
      ? x.createLinearGradient(0, 0, tam, 0)
      : x.createLinearGradient(0, 0, 0, tam);
    for (var i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    x.fillStyle = g;
    x.fillRect(0, 0, tam, tam);
    return g;
  }

  function brilhoTopo(x, tam, alpha) {
    var g = x.createLinearGradient(0, 0, 0, tam * 0.45);
    g.addColorStop(0, 'rgba(255,255,255,' + alpha + ')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g;
    x.fillRect(0, 0, tam, tam * 0.45);
  }

  /* ---------- 24 texturas ---------- */

  var TEX = {

    lava: function (x, t) {
      grad(x, t, [[0, '#FFE066'], [0.35, '#FF9A00'], [0.7, '#E63A00'], [1, '#7A0B00']]);
      for (var i = 0; i < 22; i++) {                       /* veios de magma */
        x.beginPath();
        x.strokeStyle = 'rgba(255,' + (120 + Math.random() * 90 | 0) + ',0,' + (0.25 + Math.random() * 0.5) + ')';
        x.lineWidth = 1 + Math.random() * 3;
        var px = Math.random() * t, py = 0;
        x.moveTo(px, py);
        while (py < t) { py += 6 + Math.random() * 10; px += (Math.random() - 0.5) * 16; x.lineTo(px, py); }
        x.stroke();
      }
      for (var k = 0; k < 90; k++) {                        /* brasas */
        x.fillStyle = 'rgba(255,244,170,' + (0.3 + Math.random() * 0.7) + ')';
        var s = 1 + Math.random() * 2;
        x.fillRect(Math.random() * t, Math.random() * t, s, s);
      }
      for (var d = 0; d < 26; d++) {                        /* crosta escura */
        x.fillStyle = 'rgba(40,0,0,' + (0.3 + Math.random() * 0.5) + ')';
        x.beginPath(); x.arc(Math.random() * t, Math.random() * t, 3 + Math.random() * 9, 0, 6.3); x.fill();
      }
    },

    metal: function (x, t) {
      grad(x, t, [[0, '#C9D2DA'], [0.5, '#8A97A3'], [1, '#5C6771']]);
      ruido(x, t, 0.35, false);
      for (var i = 0; i < t; i += 8) {                      /* listras escovadas */
        x.fillStyle = 'rgba(255,255,255,' + (0.04 + Math.random() * 0.09) + ')';
        x.fillRect(0, i, t, 1);
        x.fillStyle = 'rgba(0,0,0,' + (0.05 + Math.random() * 0.08) + ')';
        x.fillRect(0, i + 2, t, 1);
      }
      brilhoTopo(x, t, 0.30);
    },

    cromo: function (x, t) {
      grad(x, t, [[0, '#0B0F14'], [0.22, '#FFFFFF'], [0.42, '#8C97A3'], [0.6, '#FFFFFF'], [0.8, '#5C6771'], [1, '#F2F6FA']], false);
      brilhoTopo(x, t, 0.20);
    },

    ouro: function (x, t) {
      grad(x, t, [[0, '#8B6914'], [0.3, '#FFD86B'], [0.55, '#FFE89A'], [0.8, '#D4A017'], [1, '#6E4F0A']], false);
      ruido(x, t, 0.18, true);
      brilhoTopo(x, t, 0.28);
    },

    vidro: function (x, t) {
      grad(x, t, [[0, 'rgba(180,235,255,0.55)'], [0.5, 'rgba(90,180,230,0.30)'], [1, 'rgba(200,245,255,0.55)']]);
      x.strokeStyle = 'rgba(255,255,255,0.55)';
      x.lineWidth = 2;
      x.strokeRect(2, 2, t - 4, t - 4);
      x.beginPath();                                        /* reflexo diagonal */
      x.moveTo(0, t * 0.7); x.lineTo(t * 0.7, 0);
      x.strokeStyle = 'rgba(255,255,255,0.35)'; x.lineWidth = 6; x.stroke();
      x.fillStyle = 'rgba(255,255,255,0.18)';
      x.fillRect(t * 0.12, t * 0.12, t * 0.18, t * 0.5);
    },

    madeira: function (x, t) {
      grad(x, t, [[0, '#8B5A2B'], [0.5, '#A9702F'], [1, '#6B3E1B']]);
      for (var y = 0; y < t; y += 7) {                       /* veios horizontais */
        var amp = 3 + Math.random() * 5, fase = Math.random() * 6.3;
        x.beginPath();
        for (var px = 0; px <= t; px++) {
          var py = y + Math.sin((px / t) * 6.3 * 1.5 + fase) * amp;
          px === 0 ? x.moveTo(px, py) : x.lineTo(px, py);
        }
        x.strokeStyle = 'rgba(60,30,10,' + (0.10 + Math.random() * 0.22) + ')';
        x.lineWidth = 1 + Math.random() * 1.5;
        x.stroke();
      }
      for (var n = 0; n < 3; n++) {                          /* nós */
        var cx = Math.random() * t, cy = Math.random() * t;
        for (var r = 9; r > 1; r -= 2) {
          x.beginPath();
          x.strokeStyle = 'rgba(55,26,8,' + (0.20 + Math.random() * 0.35) + ')';
          x.lineWidth = 1.4;
          x.ellipse(cx, cy, r, r * 0.65, 0, 0, 6.3);
          x.stroke();
        }
      }
    },

    pedra: function (x, t) {
      grad(x, t, [[0, '#9AA0A6'], [0.5, '#6E747A'], [1, '#474C52']]);
      ruido(x, t, 0.5, true);
      ruido(x, t, 0.22, false);
      for (var i = 0; i < 5; i++) {                          /* rachaduras */
        x.beginPath();
        var px = Math.random() * t, py = Math.random() * t;
        x.moveTo(px, py);
        for (var s = 0; s < 4; s++) {
          px += (Math.random() - 0.5) * 40;
          py += (Math.random() - 0.5) * 40;
          x.lineTo(px, py);
        }
        x.strokeStyle = 'rgba(20,22,26,0.45)';
        x.lineWidth = 1 + Math.random();
        x.stroke();
      }
    },

    gelo: function (x, t) {
      grad(x, t, [[0, '#EAF8FF'], [0.45, '#A8DCF5'], [1, '#5FAED6']]);
      for (var i = 0; i < 14; i++) {                         /* facetas de cristal */
        x.beginPath();
        x.moveTo(Math.random() * t, Math.random() * t);
        x.lineTo(Math.random() * t, Math.random() * t);
        x.lineTo(Math.random() * t, Math.random() * t);
        x.closePath();
        x.fillStyle = 'rgba(255,255,255,' + (0.05 + Math.random() * 0.22) + ')';
        x.fill();
      }
      brilhoTopo(x, t, 0.35);
    },

    agua: function (x, t) {
      grad(x, t, [[0, '#7FD4FF'], [0.5, '#2E9BD6'], [1, '#0B5A8C']]);
      for (var y = 0; y < t; y += 8) {
        x.beginPath();
        for (var px = 0; px <= t; px += 2) {
          var py = y + Math.sin((px / t) * 6.3 * 2 + y) * 3;
          px === 0 ? x.moveTo(px, py) : x.lineTo(px, py);
        }
        x.strokeStyle = 'rgba(255,255,255,' + (0.06 + Math.random() * 0.16) + ')';
        x.lineWidth = 1.5;
        x.stroke();
      }
      brilhoTopo(x, t, 0.22);
    },

    grama: function (x, t) {
      grad(x, t, [[0, '#6FBF3A'], [0.5, '#3F8F1F'], [1, '#245910']]);
      for (var i = 0; i < 240; i++) {                        /* folhas */
        var px = Math.random() * t, py = Math.random() * t;
        x.strokeStyle = 'rgba(' + (120 + Math.random() * 90 | 0) + ',' + (180 + Math.random() * 70 | 0) + ',40,' + (0.25 + Math.random() * 0.5) + ')';
        x.lineWidth = 1;
        x.beginPath();
        x.moveTo(px, py);
        x.lineTo(px + (Math.random() - 0.5) * 3, py - 3 - Math.random() * 5);
        x.stroke();
      }
    },

    asfalto: function (x, t) {
      grad(x, t, [[0, '#4A4F55'], [0.5, '#33383D'], [1, '#20242A']]);
      for (var i = 0; i < t * t * 0.5; i++) {                /* grãos */
        var v = 60 + Math.random() * 120 | 0;
        x.fillStyle = 'rgba(' + v + ',' + v + ',' + (v + 6) + ',' + (0.12 + Math.random() * 0.4) + ')';
        x.fillRect(Math.random() * t, Math.random() * t, 1, 1);
      }
      x.fillStyle = 'rgba(255,220,90,0.55)';                 /* faixa */
      x.fillRect(0, t * 0.48, t, 3);
    },

    grade: function (x, t) {
      x.fillStyle = '#08131A'; x.fillRect(0, 0, t, t);
      x.strokeStyle = 'rgba(0,229,255,0.55)'; x.lineWidth = 1.5;
      for (var i = 0; i <= t; i += 16) {
        x.beginPath(); x.moveTo(i, 0); x.lineTo(i, t); x.stroke();
        x.beginPath(); x.moveTo(0, i); x.lineTo(t, i); x.stroke();
      }
      x.strokeStyle = 'rgba(0,229,255,0.95)'; x.lineWidth = 2;
      x.strokeRect(1, 1, t - 2, t - 2);
    },

    nebulosa: function (x, t) {
      grad(x, t, [[0, '#1B0B3B'], [0.45, '#4B1B7A'], [0.75, '#8A2BE2'], [1, '#12061F']]);
      for (var i = 0; i < 7; i++) {                          /* nuvens */
        var g = x.createRadialGradient(
          Math.random() * t, Math.random() * t, 0,
          Math.random() * t, Math.random() * t, t * 0.45);
        g.addColorStop(0, 'rgba(' + (150 + Math.random() * 100 | 0) + ',60,255,0.22)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        x.fillStyle = g; x.fillRect(0, 0, t, t);
      }
      for (var s = 0; s < 90; s++) {                         /* estrelas */
        var a = 0.35 + Math.random() * 0.65;
        x.fillStyle = 'rgba(255,255,255,' + a + ')';
        var sz = Math.random() < 0.9 ? 1 : 2;
        x.fillRect(Math.random() * t, Math.random() * t, sz, sz);
      }
    },

    areia: function (x, t) {
      grad(x, t, [[0, '#F0DCB0'], [0.5, '#D9BD86'], [1, '#B99A63']]);
      for (var i = 0; i < t * t * 0.55; i++) {
        var v = 150 + Math.random() * 90 | 0;
        x.fillStyle = 'rgba(' + v + ',' + (v - 24) + ',' + (v - 70) + ',' + (0.15 + Math.random() * 0.4) + ')';
        x.fillRect(Math.random() * t, Math.random() * t, 1, 1);
      }
      for (var y = 0; y < t; y += 10) {                       /* ondulações */
        x.beginPath();
        for (var px = 0; px <= t; px += 3) {
          x.lineTo(px, y + Math.sin(px / 9 + y) * 2);
        }
        x.strokeStyle = 'rgba(140,110,70,0.18)'; x.lineWidth = 1.6; x.stroke();
      }
    },

    chocolate: function (x, t) {
      grad(x, t, [[0, '#5A2E12'], [0.35, '#7B4420'], [0.7, '#3B1F0B'], [1, '#241005']]);
      for (var i = 0; i < 40; i++) {                          /* bolhas */
        var cx = Math.random() * t, cy = Math.random() * t, r = 1 + Math.random() * 4;
        var g = x.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 0, cx, cy, r);
        g.addColorStop(0, 'rgba(190,130,80,0.65)');
        g.addColorStop(1, 'rgba(40,20,6,0.25)');
        x.fillStyle = g;
        x.beginPath(); x.arc(cx, cy, r, 0, 6.3); x.fill();
      }
      brilhoTopo(x, t, 0.16);
    },

    neon: function (x, t) {
      x.fillStyle = '#06030F'; x.fillRect(0, 0, t, t);
      var cores = ['#FF2D95', '#00E5FF', '#7C4DFF', '#FFE600'];
      for (var i = 0; i < 9; i++) {
        var c = cores[i % cores.length];
        x.strokeStyle = c;
        x.lineWidth = 2 + Math.random() * 3;
        x.shadowColor = c;
        x.shadowBlur = 10;
        x.beginPath();
        if (Math.random() < 0.5) {
          var yy = Math.random() * t;
          x.moveTo(0, yy); x.lineTo(t, yy + (Math.random() - 0.5) * 24);
        } else {
          var xx = Math.random() * t;
          x.moveTo(xx, 0); x.lineTo(xx + (Math.random() - 0.5) * 24, t);
        }
        x.stroke();
      }
      x.shadowBlur = 0;
    },

    tijolo: function (x, t) {
      x.fillStyle = '#2A211C'; x.fillRect(0, 0, t, t);       /* argamassa */
      var h = t / 4, w = t / 2;
      for (var row = 0; row < 4; row++) {
        var off = (row % 2) ? w / 2 : 0;
        for (var col = -1; col < 3; col++) {
          var bx = col * w + off + 2, by = row * h + 2;
          var g = x.createLinearGradient(bx, by, bx, by + h);
          g.addColorStop(0, '#B5503A');
          g.addColorStop(0.6, '#9C402C');
          g.addColorStop(1, '#7A2E20');
          x.fillStyle = g;
          x.fillRect(bx, by, w - 4, h - 4);
          x.fillStyle = 'rgba(255,255,255,0.07)';
          x.fillRect(bx, by, w - 4, 2);
        }
      }
      ruido(x, t, 0.18, true);
    },

    marmore: function (x, t) {
      grad(x, t, [[0, '#F7F9FB'], [0.5, '#E7EBF0'], [1, '#D2D8DF']]);
      for (var i = 0; i < 8; i++) {                          /* veios */
        x.beginPath();
        var px = Math.random() * t, py = -4;
        x.moveTo(px, py);
        while (py < t + 4) {
          py += 8 + Math.random() * 14;
          px += (Math.random() - 0.5) * 26;
          x.lineTo(px, py);
        }
        x.strokeStyle = 'rgba(120,130,145,' + (0.12 + Math.random() * 0.3) + ')';
        x.lineWidth = 0.8 + Math.random() * 2;
        x.stroke();
      }
    },

    couro: function (x, t) {
      grad(x, t, [[0, '#6B4A2F'], [0.5, '#553A24'], [1, '#3A2618']]);
      for (var i = 0; i < t * t * 0.22; i++) {               /* poros */
        x.fillStyle = 'rgba(0,0,0,' + (0.10 + Math.random() * 0.28) + ')';
        x.beginPath();
        x.arc(Math.random() * t, Math.random() * t, 0.6 + Math.random() * 1.2, 0, 6.3);
        x.fill();
      }
      brilhoTopo(x, t, 0.10);
    },

    plasma: function (x, t) {
      grad(x, t, [[0, '#2B0A4A'], [0.4, '#7B1FA2'], [0.7, '#E040FB'], [1, '#12041F']]);
      for (var i = 0; i < 12; i++) {
        var cx = Math.random() * t, cy = Math.random() * t;
        x.beginPath();
        for (var a = 0; a < 6.3; a += 0.25) {
          var r = 6 + Math.sin(a * 3 + i) * 8 + Math.random() * 4;
          var px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
          a === 0 ? x.moveTo(px, py) : x.lineTo(px, py);
        }
        x.strokeStyle = 'rgba(255,140,255,' + (0.25 + Math.random() * 0.4) + ')';
        x.lineWidth = 1.5;
        x.stroke();
      }
    },

    cristal: function (x, t) {
      grad(x, t, [[0, '#B8FFE8'], [0.45, '#3FD9B0'], [1, '#0E7A63']]);
      for (var i = 0; i < 10; i++) {                         /* facetas */
        x.beginPath();
        var cx = Math.random() * t, cy = Math.random() * t, r = 10 + Math.random() * 26;
        for (var s = 0; s < 6; s++) {
          var a = (Math.PI * 2 / 6) * s;
          var px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
          s === 0 ? x.moveTo(px, py) : x.lineTo(px, py);
        }
        x.closePath();
        x.fillStyle = 'rgba(255,255,255,' + (0.04 + Math.random() * 0.16) + ')';
        x.strokeStyle = 'rgba(255,255,255,' + (0.12 + Math.random() * 0.28) + ')';
        x.lineWidth = 1;
        x.fill(); x.stroke();
      }
      brilhoTopo(x, t, 0.30);
    },

    ferrugem: function (x, t) {
      grad(x, t, [[0, '#8A4B22'], [0.5, '#A65C22'], [1, '#4E2A12']]);
      for (var i = 0; i < 26; i++) {                         /* manchas */
        var cx = Math.random() * t, cy = Math.random() * t, r = 3 + Math.random() * 16;
        var g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, 'rgba(' + (150 + Math.random() * 80 | 0) + ',70,20,0.55)');
        g.addColorStop(1, 'rgba(60,25,8,0)');
        x.fillStyle = g;
        x.beginPath(); x.arc(cx, cy, r, 0, 6.3); x.fill();
      }
      ruido(x, t, 0.30, true);
    },

    concreto: function (x, t) {
      grad(x, t, [[0, '#B9BEC4'], [0.5, '#9AA0A7'], [1, '#7C828A']]);
      ruido(x, t, 0.35, true);
      ruido(x, t, 0.18, false);
      for (var i = 0; i < 40; i++) {                         /* poros */
        x.fillStyle = 'rgba(70,74,80,' + (0.10 + Math.random() * 0.25) + ')';
        x.beginPath();
        x.arc(Math.random() * t, Math.random() * t, 0.8 + Math.random() * 1.8, 0, 6.3);
        x.fill();
      }
    },

    holograma: function (x, t) {
      grad(x, t, [[0, 'rgba(0,60,90,0.9)'], [0.5, 'rgba(0,140,190,0.75)'], [1, 'rgba(0,60,90,0.9)']]);
      for (var y = 0; y < t; y += 3) {                       /* scanlines */
        x.fillStyle = 'rgba(0,229,255,' + (y % 6 === 0 ? 0.20 : 0.06) + ')';
        x.fillRect(0, y, t, 1);
      }
      x.strokeStyle = 'rgba(120,255,255,0.85)'; x.lineWidth = 1.5;
      x.strokeRect(3, 3, t - 6, t - 6);
      x.fillStyle = 'rgba(160,255,255,0.16)';
      x.fillRect(0, (Date.now() / 30) % t, t, 8);
    },

    /* ---------- +20 texturas ---------- */

    obsidiana: function (x, t) {
      grad(x, t, [[0, '#1A1226'], [0.45, '#0B0714'], [1, '#2A1B3D']]);
      for (var i = 0; i < 10; i++) {                          /* facetas de vidro vulcânico */
        x.beginPath();
        var cx = Math.random() * t, cy = Math.random() * t, r = 8 + Math.random() * 26;
        for (var s = 0; s < 3; s++) {
          var a = Math.random() * 6.3;
          var px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
          s === 0 ? x.moveTo(px, py) : x.lineTo(px, py);
        }
        x.closePath();
        x.fillStyle = 'rgba(120,80,190,' + (0.04 + Math.random() * 0.12) + ')';
        x.fill();
        x.strokeStyle = 'rgba(170,120,255,' + (0.10 + Math.random() * 0.25) + ')';
        x.lineWidth = 1; x.stroke();
      }
      brilhoTopo(x, t, 0.14);
    },

    basalto: function (x, t) {
      grad(x, t, [[0, '#3A3A40'], [0.5, '#26262C'], [1, '#151519']]);
      for (var i = 0; i < t * t * 0.4; i++) {
        var v = 30 + Math.random() * 60 | 0;
        x.fillStyle = 'rgba(' + v + ',' + v + ',' + (v + 4) + ',' + (0.2 + Math.random() * 0.45) + ')';
        x.fillRect(Math.random() * t, Math.random() * t, 1, 1);
      }
      for (var k = 0; k < 9; k++) {                           /* juntas colunares */
        x.beginPath();
        var px = Math.random() * t, py = 0;
        x.moveTo(px, py);

  var NOMES = Object.keys(TEX);

  /* ---------- Fuzzy match por similaridade (fallback final) ---------- */

  /* Levenshtein edit distance. */
  function editDist(a, b) {
    var m = a.length, n = b.length;
    var dp = [];
    for (var i = 0; i <= m; i++) { dp[i] = [i]; }
    for (var j = 0; j <= n; j++) { dp[0][j] = j; }
    for (i = 1; i <= m; i++) {
      for (j = 1; j <= n; j++) {
        var cost = a[i - 1] === b[j - 1] ? 0 : 1;
        dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
      }
    }
    return dp[m][n];
  }

  /* Devolve o nome de textura mais próximo dentre NOMES.
     Prioriza: (1) igual, (2) substring match, (3) palavra embutida, (4) menor editDist.
     Sempre devolve algo — nunca undefined/null. */
  function fuzzyMatch(nome) {
    var norm = String(nome || '').toLowerCase().trim().replace(/[\s_-]+/g, '');
    if (!norm) return NOMES[0] || 'pedra';

    // Passada 1: exact match normalized
    for (var i = 0; i < NOMES.length; i++) {
      if (NOMES[i].replace(/[\s_-]+/g, '') === norm) return NOMES[i];
    }
    // Passada 2: word overlap — pelo menos uma palavra coincide (mais específico que substring)
    var words = String(nome).toLowerCase().split(/[\s_-]+/);
    for (i = 0; i < NOMES.length; i++) {
      var twords = NOMES[i].split('_');
      for (var w = 0; w < words.length; w++) {
        for (var t = 0; t < twords.length; t++) {
          if (words[w] === twords[t]) return NOMES[i];
        }
      }
    }
    // Passada 3: substring — nome contém tex ou tex contém nome
    for (i = 0; i < NOMES.length; i++) {
      var clean = NOMES[i].replace(/[\s_-]+/g, '');
      if (clean.indexOf(norm) >= 0 || norm.indexOf(clean) >= 0) return NOMES[i];
    }
    // Passada 4: menor edit distance (só se razoável — max 3 ou 30% do tamanho)
    var best = NOMES[0], bestD = Infinity;
    var threshold = Math.max(3, Math.floor(norm.length * 0.3));
    for (i = 0; i < NOMES.length; i++) {
      var d = editDist(norm, NOMES[i].replace(/[\s_-]+/g, ''));
      if (d < bestD) { bestD = d; best = NOMES[i]; }
    }
    return bestD <= threshold ? best : NOMES[0];
  }

  /* ============================================================
   * NEON — brilho luminoso com raio de 20 px.
   * Três alvos, mesma linguagem: CSS/DOM, Canvas2D e three.js.
   * Regra: corpo escuro + núcleo aceso + halo caindo no fundo escuro.
   * Sem bloom/EffectComposer (a DIRECTIVE proíbe addons de three).
   * ============================================================ */
  var PALETA_NEON = {
    verde: '#39ff14', azul: '#18a0ff', ciano: '#00ffe1', rosa: '#ff2fd0',
    roxo: '#a855f7', amarelo: '#ffe93d', laranja: '#ff7a18',
    vermelho: '#ff2b3d', branco: '#ffffff',
    /* apelidos em inglês, para prompt em qualquer idioma */
    green: '#39ff14', blue: '#18a0ff', cyan: '#00ffe1', pink: '#ff2fd0',
    magenta: '#ff2fd0', purple: '#a855f7', violeta: '#a855f7',
    yellow: '#ffe93d', orange: '#ff7a18', red: '#ff2b3d', white: '#ffffff'
  };

  /* Aceita nome da paleta, #hex, rgb()/hsl() ou número 0xRRGGBB. */
  function corDe(c) {
    if (c == null || c === '') return PALETA_NEON.verde;
    if (typeof c === 'number') {
      return '#' + ('000000' + (c >>> 0).toString(16)).slice(-6);
    }
    var s = String(c).trim();
    var k = s.toLowerCase();
    if (PALETA_NEON[k]) return PALETA_NEON[k];
    return s;

  /* Normaliza QUALQUER cor CSS para [r,g,b] 0..255 (contexto 1x1 + cache). */
  var CANAIS = {};
  var CTX_COR = null;
  function ctxCor() {
    if (!CTX_COR) {
      var c = document.createElement('canvas');
      c.width = c.height = 1;
      CTX_COR = c.getContext('2d');
    }
    return CTX_COR;
  }
  function canais(cor) {
    var c = corDe(cor);
    if (CANAIS[c]) return CANAIS[c];
    var x = ctxCor();
    x.clearRect(0, 0, 1, 1);
    x.fillStyle = '#000000';
    x.fillStyle = c;
    x.fillRect(0, 0, 1, 1);
    var d = x.getImageData(0, 0, 1, 1).data;
    var out = [d[0], d[1], d[2]];
    CANAIS[c] = out;
    return out;
  }
  function rgba(cor, a) {
    var p = canais(cor);
    var al = a == null ? 1 : a;
    return 'rgba(' + p[0] + ',' + p[1] + ',' + p[2] + ',' + (Math.round(al * 1000) / 1000) + ')';
  }

  /* ---------- 1) CSS/DOM ---------- */
  /* box-shadow de 3 camadas: núcleo, média e halo largo. */
  function glow(cor, raio) {
    var r = Number(raio) > 0 ? Number(raio) : 20;
    var c = corDe(cor);
    return '0 0 ' + r + 'px ' + rgba(c, 0.95) + ', ' +
           '0 0 ' + (r * 2) + 'px ' + rgba(c, 0.45) + ', ' +
           '0 0 ' + (r * 4) + 'px ' + rgba(c, 0.18);
  }
  /* Acende um elemento: brilho de caixa + brilho do recorte (útil em SVG/texto). */
  function brilho(el, cor, raio) {
    if (!el || !el.style) return el;
    var r = Number(raio) > 0 ? Number(raio) : 20;
    var c = corDe(cor);
    el.style.boxShadow = glow(c, r);
    el.style.filter = 'drop-shadow(0 0 ' + r + 'px ' + rgba(c, 0.75) + ')';
    return el;
  }

  /* ---------- 2) Canvas2D ---------- */
  function luz(ctx, cor, raio) {
    if (!ctx) return ctx;
    var r = Number(raio) > 0 ? Number(raio) : 20;
    var c = corDe(cor);
    ctx.shadowColor = rgba(c, 0.95);
    ctx.shadowBlur = r;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    return ctx;
  }
  function luzOff(ctx) {
    if (!ctx) return ctx;
    ctx.shadowColor = 'rgba(0,0,0,0)';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    return ctx;
  }

  function caminhoArred(ctx, x, y, w, h, r) {
    var rr = Math.max(0, Math.min(r || 0, Math.min(w, h) / 2));
    ctx.beginPath();
    if (!rr) { ctx.rect(x, y, w, h); return; }
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.arcTo(x + w, y, x + w, y + rr, rr);
    ctx.lineTo(x + w, y + h - rr);
    ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
    ctx.lineTo(x + rr, y + h);
    ctx.arcTo(x, y + h, x, y + h - rr, rr);
    ctx.lineTo(x, y + rr);
    ctx.arcTo(x, y, x + rr, y, rr);
    ctx.closePath();
  }

  /* Peça pronta de tetris/2D: halo + corpo escuro + núcleo branco + borda acesa.

  function peca(ctx, x0, y0, w, h, cor, o) {
    if (!ctx) return ctx;
    o = o || {};
    var c = corDe(cor);
    var raio = o.raio != null ? o.raio : Math.min(w, h) * 0.16;
    var r = o.brilho != null ? Number(o.brilho) : 20;

    ctx.save();
    /* halo: duas passadas com shadowBlur, antes de recortar */
    caminhoArred(ctx, x0, y0, w, h, raio);
    ctx.fillStyle = rgba(c, 0.92);
    ctx.shadowColor = rgba(c, 0.95);
    ctx.shadowBlur = r;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
    ctx.fill();
    ctx.shadowBlur = r * 1.8;
    ctx.globalAlpha = 0.45;
    ctx.fill();
    ctx.globalAlpha = 1;
    luzOff(ctx);

    /* corpo + núcleo quase branco no terço superior */
    caminhoArred(ctx, x0, y0, w, h, raio);
    ctx.clip();
    ctx.fillStyle = rgba(c, 0.92);
    ctx.fillRect(x0, y0, w, h);
    var g = ctx.createLinearGradient(0, y0, 0, y0 + h);
    g.addColorStop(0, rgba('#ffffff', 0.30));
    g.addColorStop(0.34, rgba('#ffffff', 0.10));
    g.addColorStop(0.56, rgba('#ffffff', 0));
    ctx.fillStyle = g;
    ctx.fillRect(x0, y0, w, h);
    ctx.restore();

    /* borda acesa */
    if (!o.semBorda) {
      caminhoArred(ctx, x0 + 0.5, y0 + 0.5, Math.max(1, w - 1), Math.max(1, h - 1), Math.max(0, raio - 0.5));
      ctx.strokeStyle = rgba('#ffffff', 0.75);
      ctx.lineWidth = o.larguraBorda || 1.5;
      ctx.stroke();
    }
    return ctx;
  }

  /* Textura: placa escura acesa por um clarão neon. */
  function pintarNeon(x, t, cor) {
    var c = corDe(cor);
    x.save();
    x.fillStyle = '#04070a';
    x.fillRect(0, 0, t, t);
    x.fillStyle = rgba(c, 0.10);
    x.fillRect(0, 0, t, t);

    var cx = t * 0.42, cy = t * 0.36;
    var g = x.createRadialGradient(cx, cy, 0, cx, cy, t * 0.78);
    g.addColorStop(0, rgba('#ffffff', 0.85));
    g.addColorStop(0.26, rgba(c, 0.95));
    g.addColorStop(0.60, rgba(c, 0.33));
    g.addColorStop(1, rgba(c, 0));
    x.fillStyle = g;
    x.fillRect(0, 0, t, t);

    /* malha fina: leitura de painel atrás do brilho */
    for (var i = 0; i <= 8; i++) {
      var p = (i / 8) * t;
      var forte = (i % 2 === 0);
      x.strokeStyle = rgba(c, forte ? 0.50 : 0.16);
      x.lineWidth = forte ? 2 : 1;
      x.beginPath();
      x.moveTo(p, 0); x.lineTo(p, t);
      x.moveTo(0, p); x.lineTo(t, p);
      x.stroke();
    }

    for (var s = 0; s < 40; s++) {
      x.fillStyle = rgba('#ffffff', 0.30 + Math.random() * 0.50);
      x.fillRect(Math.random() * t, Math.random() * t, 1 + Math.random() * 2, 1 + Math.random() * 2);
    }

    /* vinheta: borda escura faz o centro parecer aceso */
    var vg = x.createRadialGradient(t / 2, t / 2, t * 0.18, t / 2, t / 2, t * 0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    x.fillStyle = vg;
    x.fillRect(0, 0, t, t);
    x.restore();
  }

  /* ---------- 3) three.js ---------- */
  /* Sprite aditivo: halo 2D que finge bloom sem addon. */
  var HALOS = {};
  function haloTex(cor, tam) {
    var c = corDe(cor);
    var t = Number(tam) > 0 ? Number(tam) : 128;
    var key = c + '@' + t;
    if (HALOS[key]) return HALOS[key];
    var cv = novo(t);
    var x = cv.getContext('2d');
    var h = t / 2;
    var g = x.createRadialGradient(h, h, 0, h, h, h);
    g.addColorStop(0, rgba('#ffffff', 1));
    g.addColorStop(0.18, rgba(c, 0.85));
    g.addColorStop(0.50, rgba(c, 0.28));
    g.addColorStop(1, rgba(c, 0));
    x.fillStyle = g;
    x.fillRect(0, 0, t, t);
    HALOS[key] = cv;
    return cv;
  }

  var HALOS_T = {};
  function haloT(cor) {
    if (typeof THREE === 'undefined' || !THREE.CanvasTexture) return null;
    var c = corDe(cor);
    if (HALOS_T[c]) return HALOS_T[c];
    var tex = new THREE.CanvasTexture(haloTex(c, 128));
    tex.needsUpdate = true;
    HALOS_T[c] = tex;
    return tex;
  }

  /* Material emissivo: color escurecido + emissive na cor, para acender no escuro. */
  var MATS_NEON = {};
  function neonMat(cor, o) {
    if (typeof THREE === 'undefined' || !THREE.MeshStandardMaterial) return null;
    o = o || {};
    var c = corDe(cor);
    var inten = o.intensidade != null ? Number(o.intensidade)
      : (o.emissiveIntensity != null ? Number(o.emissiveIntensity) : 1.6);
    var base = o.base != null ? Number(o.base) : 0.16;
    var rough = o.roughness != null ? Number(o.roughness) : 0.35;
    var metal = o.metalness != null ? Number(o.metalness) : 0;
    var tex = o.textura ? String(o.textura) : '';
    var rep = o.repeat != null ? o.repeat : 1;
    var key = c + '|' + inten + '|' + base + '|' + rough + '|' + metal + '|' + tex + '|' + rep;
    if (MATS_NEON[key]) return MATS_NEON[key];

    var m = new THREE.MeshStandardMaterial({
      color: new THREE.Color(c).multiplyScalar(base),
      emissive: new THREE.Color(c),
      emissiveIntensity: inten,
      roughness: rough,
      metalness: metal
    });
    if (tex) {
      var t = three(tex, rep, rep);
      if (t) { m.map = t; m.emissiveMap = t; m.needsUpdate = true; }
    }
    MATS_NEON[key] = m;
    return m;
  }

  /* Anexa um halo aditivo à mesh. Em 3D não existe px: escala = raio da

  function halo(mesh, cor, o) {
    if (!mesh || typeof THREE === 'undefined' || !THREE.Sprite || !THREE.SpriteMaterial) return null;
    o = o || {};
    var c = corDe(cor);
    if (mesh.userData && mesh.userData.nxHalo && mesh.userData.nxHaloCor === c) {
      return mesh.userData.nxHalo;
    }
    var tex = haloT(c);
    if (!tex) return null;

    var raio = 1;
    if (mesh.geometry) {
      if (!mesh.geometry.boundingSphere) mesh.geometry.computeBoundingSphere();
      if (mesh.geometry.boundingSphere) raio = mesh.geometry.boundingSphere.radius || 1;
    }
    var s = raio * (o.escala != null ? Number(o.escala) : 2.6) * 1.7;

    var mat = new THREE.SpriteMaterial({
      map: tex,
      color: 0xffffff,
      transparent: true,
      opacity: o.opacidade != null ? Number(o.opacidade) : 0.9,
      blending: THREE.AdditiveBlending,
      depthWrite: false

    sp.scale.set(s, s, 1);
    sp.renderOrder = 2;
    if (o.pos) sp.position.set(o.pos[0] || 0, o.pos[1] || 0, o.pos[2] || 0);
    mesh.add(sp);
    if (mesh.userData) { mesh.userData.nxHalo = sp; mesh.userData.nxHaloCor = c; }
    return sp;
  }

  /* ============================================================
   * ULTRA BRILHANTE + RUGOSO — pintores.
   * Regra do brilhante: reflexo NÍTIDO (banda fina e forte), fundo
   * escuro/saturado e contraste alto. Regra do rugoso: base quase
   * plana + grão fino + traços curtos, sem gradiente direcional
   * (assim o tile continua sem costura).
   * ============================================================ */

  /* Grão genérico: pontos claros ou escuros, 1 px (ou 1–3 px). */
  function grao(x, t, n, aMin, aMax, grande) {
    for (var i = 0; i < n; i++) {
      var a = (aMin + Math.random() * (aMax - aMin)).toFixed(3);
      x.fillStyle = Math.random() < 0.5
        ? 'rgba(255,255,255,' + a + ')'
        : 'rgba(0,0,0,' + a + ')';
      var s = grande ? 1 + Math.random() * 2 : 1;
      x.fillRect(Math.random() * t, Math.random() * t, s, s);
    }
  }

  /* Laca preta: preto profundo, reflexo diagonal largo e sheen na quina. */
  function pintarPiano(x, t) {
    grad(x, t, [[0, '#000000'], [0.32, '#0d0d12'], [0.58, '#050508'], [1, '#000000']]);

    var g = x.createLinearGradient(0, t, t, 0);
    g.addColorStop(0.36, 'rgba(255,255,255,0)');
    g.addColorStop(0.44, 'rgba(255,255,255,0.05)');
    g.addColorStop(0.50, 'rgba(255,255,255,0.17)');
    g.addColorStop(0.56, 'rgba(255,255,255,0.04)');
    g.addColorStop(0.62, 'rgba(255,255,255,0)');
    x.fillStyle = g;
    x.fillRect(0, 0, t, t);

    var rg = x.createRadialGradient(t * 0.12, t * 0.08, 0, t * 0.12, t * 0.08, t * 0.9);
    rg.addColorStop(0, 'rgba(255,255,255,0.13)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = rg;
    x.fillRect(0, 0, t, t);

    for (var i = 0; i < 2; i++) {
      var y = t * (0.28 + i * 0.40);
      var h = t * 0.045;
      var sg = x.createLinearGradient(0, y - h, 0, y + h);
      sg.addColorStop(0, 'rgba(255,255,255,0)');
      sg.addColorStop(0.5, 'rgba(255,255,255,' + (i ? '0.16' : '0.34') + ')');
      sg.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = sg;
      x.fillRect(0, y - h, t, h * 2);

      x.fillStyle = 'rgba(255,255,255,' + (i ? '0.30' : '0.62') + ')';
      x.fillRect(0, y, t, 1);
    }

    for (var k = 0; k < 700; k++) {              /* casca de laranja */
      x.fillStyle = Math.random() < 0.5
        ? 'rgba(255,255,255,' + (0.008 + Math.random() * 0.018).toFixed(3) + ')'
        : 'rgba(0,0,0,' + (0.016 + Math.random() * 0.036).toFixed(3) + ')';
      x.fillRect(Math.random() * t, Math.random() * t, 1, 1);
    }
  }

  /* Plástico colorido: cor saturada + highlight curto e forte. */
  function pintarPlastico(x, t, cor) {
    var p = canais(cor);
    x.fillStyle = 'rgb(' + p[0] + ',' + p[1] + ',' + p[2] + ')';
    x.fillRect(0, 0, t, t);

    grad(x, t, [[0, 'rgba(255,255,255,0.26)'], [0.30, 'rgba(255,255,255,0.06)'],
                [0.55, 'rgba(0,0,0,0.04)'], [1, 'rgba(0,0,0,0.34)']]);

    var rg = x.createRadialGradient(t * 0.26, t * 0.20, 0, t * 0.26, t * 0.20, t * 0.62);
    rg.addColorStop(0, 'rgba(255,255,255,0.42)');
    rg.addColorStop(0.45, 'rgba(255,255,255,0.10)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = rg;
    x.fillRect(0, 0, t, t);

    var sg = x.createLinearGradient(0, t * 0.16, 0, t * 0.30);
    sg.addColorStop(0, 'rgba(255,255,255,0)');
    sg.addColorStop(0.5, 'rgba(255,255,255,0.30)');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = sg;
    x.fillRect(0, t * 0.16, t, t * 0.14);

    grao(x, t, 800, 0.012, 0.042, false);

  /* Vidro: claro (translúcido azulado) e fumê (escuro).
     Faixas diagonais em 'lighter' simulam a reflexão da lâmina. */
  function pintarVidro(x, t, fumaca) {
    if (fumaca) {
      grad(x, t, [[0, '#1a2028'], [0.5, '#0c1016'], [1, '#161c24']]);
    } else {
      grad(x, t, [[0, 'rgba(198,228,242,0.88)'], [0.45, 'rgba(148,190,214,0.72)'],
                  [1, 'rgba(206,232,245,0.86)']]);
    }

    var linha = fumaca ? '120,150,175' : '255,255,255';
    x.save();
    x.globalCompositeOperation = 'lighter';
    x.lineCap = 'butt';
    for (var i = 0; i < 3; i++) {
      var a = fumaca ? 0.10 + i * 0.02 : 0.16 - i * 0.03;
      x.strokeStyle = 'rgba(' + linha + ',' + a.toFixed(3) + ')';
      x.lineWidth = 10 - i * 2;
      x.beginPath();
      x.moveTo(-t * 0.1 + i * t * 0.06, t * 1.05);
      x.lineTo(t * 0.75 + i * t * 0.06, -t * 0.05);
      x.stroke();
    }
    x.restore();

    var rg = x.createRadialGradient(t * 0.22, t * 0.14, 0, t * 0.22, t * 0.14, t * 0.56);
    rg.addColorStop(0, 'rgba(255,255,255,' + (fumaca ? '0.16' : '0.30') + ')');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = rg;
    x.fillRect(0, 0, t, t);

    x.beginPath();
    x.moveTo(t * 0.62, t * 0.06);
    x.lineTo(t * 0.74, t * 0.06);
    x.lineTo(t * 0.42, t * 0.52);
    x.lineTo(t * 0.30, t * 0.52);
    x.closePath();
    x.fillStyle = 'rgba(255,255,255,' + (fumaca ? '0.10' : '0.34') + ')';
    x.fill();

    x.strokeStyle = 'rgba(255,255,255,' + (fumaca ? '0.40' : '0.62') + ')';
    x.lineWidth = 3;
    x.strokeRect(1.5, 1.5, t - 3, t - 3);
  }

  /* Cortiça: fragmentos elípticos irregulares. */

  /* Juta: trama aberta sobre fibra crua. */

  function pbr(material, nome, opts) {
    if (!material) return material;
    var o = opts || {};
    var n = String(nome || '').toLowerCase().trim();
    if (!TEX[n]) n = mapear(n);
    if (!TEX[n]) n = fuzzyMatch(n);
    var cfg = acabar(n);
    var map = three(n, o.repeat, o.repeat);
    if (map) material.map = map;
    var forca = o.relevo === 0 ? 0 : (o.relevo ? cfg.relevo * o.relevo : cfg.relevo);
    var nm = forca > 0 ? normal(n, forca, o.repeat, o.repeat) : null;
    if (nm) {
      material.normalMap = nm;
      material.normalScale = new THREE.Vector2(o.normalScale || 1, o.normalScale || 1);
    }
    if (o.bump) {                        /* relevo grátis extra: reusa a própria cor */
      var bt = material.map || three(n, o.repeat, o.repeat);
      if (bt) {
        material.bumpMap = bt;
        material.bumpScale = Number(o.bump);
      }
    }
    material.roughness = o.roughness != null ? o.roughness : cfg.roughness;
    material.metalness = o.metalness != null ? o.metalness : cfg.metalness;
    material.needsUpdate = true;
    return material;
  }

  /* Gel translúcido pronto: MeshPhysicalMaterial calibrado (bloco GELATINA do prompt).
     NxTex.gel(null, 0x66ffcc)  -> material novo
     NxTex.gel(mat, 0x66ffcc)   -> reaproveita o material existente
     Nunca usa attenuationDistance < 2.5: abaixo disso o gel escurece e vira resina preta. */
  function gel(material, cor, opts) {
    if (typeof THREE === 'undefined' || !THREE.MeshPhysicalMaterial) return material;
    var o = opts || {};
    var m;
    if (material && material.isMeshPhysicalMaterial) {
      m = material;
    } else {
      m = new THREE.MeshPhysicalMaterial();
      if (material && material.color && m.color) m.color.copy(material.color);
    }
    var c = (cor != null) ? cor : (o.color != null ? o.color : null);
    if (c != null && m.color) m.color.set(c);
    m.transmission = o.transmission != null ? o.transmission : 0.95;
    m.thickness = o.thickness != null ? o.thickness : 1.1;
    m.ior = o.ior != null ? o.ior : 1.36;
    m.roughness = o.roughness != null ? o.roughness : 0.08;
    m.metalness = 0;
    m.clearcoat = o.clearcoat != null ? o.clearcoat : 0.4;
    m.clearcoatRoughness = o.clearcoatRoughness != null ? o.clearcoatRoughness : 0.1;
    m.attenuationDistance = Math.max(2.5, Number(o.attenuationDistance) || 2.5);
    if (o.emissive != null && m.emissive) {
      m.emissive.set(o.emissive);
      m.emissiveIntensity = o.emissiveIntensity != null ? o.emissiveIntensity : 0.12;
    }
    m.depthWrite = false;
    m.needsUpdate = true;
    return m;
  }

  /* Cubo/corpo de gel com ARESTAS ARREDONDADAS (superelipsoide).
     BoxGeometry puro = resina com aresta cortante; gel precisa de quina gorda.
     NxTex.gelGeo(1.7,1.7,1.7)                 -> cubo estufado padrão (seg 12, n 4.2, 0.86)
     NxTex.gelGeo(1.2,2.4,1.2,{seg:16,n:3.2})  -> gota/bolha mais arredondada (n menor = mais goma)
     Retorna THREE.BufferGeometry com normais recalculadas. */
  function gelGeo(w, h, d, opts) {
    if (typeof THREE === 'undefined' || !THREE.BoxGeometry) return null;
    var o = opts || {};
    var seg = Math.max(2, Math.min(24, o.seg || 12));
    var n = o.n || 4.2;
    var inchar = o.inchar != null ? o.inchar : 0.86;
    var g = new THREE.BoxGeometry(w || 1.6, h || w || 1.6, d || w || 1.6, seg, seg, seg);
    var p = g.attributes.position;
    var hx = (w || 1.6) / 2, hy = (h || w || 1.6) / 2, hz = (d || w || 1.6) / 2;
    var v = new THREE.Vector3();
    for (var i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      var ax = Math.abs(v.x / hx), ay = Math.abs(v.y / hy), az = Math.abs(v.z / hz);
      var dist = Math.pow(Math.pow(ax, n) + Math.pow(ay, n) + Math.pow(az, n), 1 / n);
      v.multiplyScalar((dist > 1e-6 ? 1 / dist : 1) * inchar);
      p.setXYZ(i, v.x, v.y, v.z);
    }
    g.computeVertexNormals();
    g.computeBoundingSphere();
    return g;
  }

  /* Cor: CanvasTexture cacheada por nome+repeat (uma por combinação, nunca por mesh). */
  var COLORS_T = {};
  function three(nome, rx, ry) {
    if (typeof THREE === 'undefined' || !THREE.CanvasTexture) return null;
    var n = String(nome || '').toLowerCase().trim();
    if (!TEX[n]) n = mapear(n);
    if (!TEX[n]) n = fuzzyMatch(n);
    var ux = rx || 1, uy = ry || rx || 1;
    var key = n + '|' + ux + 'x' + uy;
    if (COLORS_T[key]) return COLORS_T[key];
    var t = new THREE.CanvasTexture(canvas(n, 256));
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 4;
    t.repeat.set(ux, uy);
    COLORS_T[key] = t;
    return t;
  }

  function aleatoria() {
    return NOMES[Math.floor(Math.random() * NOMES.length)];
  }

  window.NxTex = {
    names: function () { return NOMES.slice(); },
    canvas: canvas,
    pattern: pattern,
    bloco: bloco,
    css: css,
    three: three,
    normal: normal,              /* normal map (THREE.CanvasTexture, cacheado) */
    normalCanvas: normalCanvas,  /* o canvas cru do normal map */
    pbr: pbr,                    /* cor + relevo + acabamento numa chamada */
    gel: gel,                    /* corpo translúcido calibrado (gelatina/slime/resina) */
    gelGeo: gelGeo,              /* geometria de gel com arestas arredondadas (superelipsoide) */
    acabamento: acabar,          /* {roughness, metalness, relevo} da família */
    aleatoria: aleatoria,
    mapear: mapear,
    brilhanteMat: brilhanteMat,  /* Material físico brilhante (clearcoat) */
    vidroMat: vidroMat,          /* Material de vidro (transmission, ior) */
    foscoMat: foscoMat,          /* Material fosco (roughness alta + bump) */
    version: '1.5.0'
  };
})();

</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cubo 3D</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101b20;
  }
  #scene {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    touch-action: none;
    cursor: grab;
    background: radial-gradient(ellipse at 50% 44%, #1b3034 0%, #142328 48%, #10191e 100%);
  }
  #scene:active { cursor: grabbing; }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
  }
</style>
</head>
<body>
<div id="scene" aria-label="Cubo tridimensional interativo"></div>
<script src="../../../vendor/three/three.min.js"></script>
<script>
(() => {
  'use strict';

  const root = document.getElementById('scene');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x142328);
  scene.fog = new THREE.Fog(0x142328, 12, 32);

  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 80);
  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance',
    alpha: false,
    stencil: false,
    depth: true
  });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  root.appendChild(renderer.domElement);

  const ambient = new THREE.HemisphereLight(0xd8edff, 0x3a3024, 0.72);
  scene.add(ambient);

  const key = new THREE.DirectionalLight(0xffd49a, 1.85);
  key.position.set(-4.5, 7.5, 5.2);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.bias = -0.0005;
  key.shadow.normalBias = 0.02;
  key.shadow.camera.left = -3;
  key.shadow.camera.right = 3;
  key.shadow.camera.top = 3;
  key.shadow.camera.bottom = -3;
  key.shadow.camera.near = 0.5;
  key.shadow.camera.far = 16;
  scene.add(key);

  const fill = new THREE.DirectionalLight(0x9ccfff, 0.42);
  fill.position.set(5, 1.5, 3.5);
  scene.add(fill);

  const rim = new THREE.DirectionalLight(0xffe4bf, 0.68);
  rim.position.set(1, 4, -5);
  scene.add(rim);

  const geometry = new THREE.BoxGeometry(1.9, 1.9, 1.9);
  const textureCanvas = document.createElement('canvas');
  textureCanvas.width = 128;
  textureCanvas.height = 128;
  const textureContext = textureCanvas.getContext('2d');
  const stonePixels = textureContext.createImageData(128, 128);
  let stoneSeed = 73421;
  function stoneRandom() {
    stoneSeed = (stoneSeed * 16807) % 2147483647;
    return (stoneSeed - 1) / 2147483646;
  }
  for (let i = 0; i < stonePixels.data.length; i += 4) {
    const grain = (stoneRandom() - 0.5) * 46;
    const shade = 105 + grain;
    stonePixels.data[i] = Math.max(0, shade * 0.91);
    stonePixels.data[i + 1] = Math.max(0, shade * 0.98);
    stonePixels.data[i + 2] = Math.max(0, shade * 1.02);
    stonePixels.data[i + 3] = 255;
  }
  textureContext.putImageData(stonePixels, 0, 0);
  for (let vein = 0; vein < 11; vein++) {
    let x = stoneRandom() * 128;
    let y = stoneRandom() * 128;
    textureContext.beginPath();
    textureContext.moveTo(x, y);
    for (let segment = 0; segment < 5; segment++) {
      x += (stoneRandom() - 0.5) * 34;
      y += 12 + (stoneRandom() - 0.5) * 20;
      textureContext.lineTo(x, y);
    }
    textureContext.strokeStyle = vein % 3 === 0 ? 'rgba(197,207,198,0.22)' : 'rgba(31,43,44,0.32)';
    textureContext.lineWidth = vein % 3 === 0 ? 1.2 : 1.8;
    textureContext.stroke();
  }
  const stoneTexture = new THREE.CanvasTexture(textureCanvas);
  stoneTexture.colorSpace = THREE.SRGBColorSpace;
  stoneTexture.anisotropy = 4;
  stoneTexture.generateMipmaps = true;
  stoneTexture.minFilter = THREE.LinearMipmapLinearFilter;
  const materials = [
    new THREE.MeshStandardMaterial({ color: 0xb7c7c0, map: stoneTexture, metalness: 0.02, roughness: 0.84 }),
    new THREE.MeshStandardMaterial({ color: 0xaabdb8, map: stoneTexture, metalness: 0.02, roughness: 0.86 }),
    new THREE.MeshStandardMaterial({ color: 0xc2cec3, map: stoneTexture, metalness: 0.01, roughness: 0.82 }),
    new THREE.MeshStandardMaterial({ color: 0xa9bbb7, map: stoneTexture, metalness: 0.02, roughness: 0.86 }),
    new THREE.MeshStandardMaterial({ color: 0xb7c9c8, map: stoneTexture, metalness: 0.02, roughness: 0.83 }),
    new THREE.MeshStandardMaterial({ color: 0x9fb5b6, map: stoneTexture, metalness: 0.02, roughness: 0.87 })
  ];
  const cube = new THREE.Mesh(geometry, materials);
  cube.castShadow = true;
  cube.receiveShadow = true;
  cube.rotation.set(0.25, -0.38, 0.04);
  scene.add(cube);

  const viewDirection = new THREE.Vector3(3.2, 2.35, 4.5).normalize();
  const clock = new THREE.Clock();
  let baseDistance = 6;
  let zoom = 1;
  let width = 1;
  let height = 1;
  let dragging = false;
  let pointerX = 0;
  let pointerY = 0;
  let lowQuality = false;
  let sampleTime = 0;
  let sampleFrames = 0;
  let accumulator = 0;
  const step = 1 / 60;
  const pixelRatioCap = Math.min(window.devicePixelRatio || 1, 1.5);

  function updateCameraDistance() {
    const verticalFov = THREE.MathUtils.degToRad(camera.fov);
    const horizontalFov = 2 * Math.atan(Math.tan(verticalFov / 2) * camera.aspect);
    const limitingHalfFov = Math.min(verticalFov, horizontalFov) * 0.5;
    const cubeRadius = Math.sqrt(3) * 0.95;
    baseDistance = cubeRadius * 1.42 / Math.sin(limitingHalfFov);
    camera.position.copy(viewDirection).multiplyScalar(baseDistance * zoom);
    camera.lookAt(0, 0, 0);
  }

  function applySize() {
    const rect = root.getBoundingClientRect();
    width = Math.max(1, rect.width);
    height = Math.max(1, rect.height);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(lowQuality ? 1 : pixelRatioCap);
    renderer.setSize(width, height, false);
    updateCameraDistance();
  }

  const resizeObserver = new ResizeObserver(applySize);
  resizeObserver.observe(root);
  window.addEventListener('resize', applySize, { passive: true });
  window.addEventListener('orientationchange', applySize, { passive: true });
  applySize();

  renderer.domElement.addEventListener('pointerdown', (event) => {
    dragging = true;
    pointerX = event.clientX;
    pointerY = event.clientY;
    renderer.domElement.setPointerCapture(event.pointerId);
  });
  renderer.domElement.addEventListener('pointermove', (event) => {
    if (!dragging) return;
    const dx = event.clientX - pointerX;
    const dy = event.clientY - pointerY;
    pointerX = event.clientX;
    pointerY = event.clientY;
    cube.rotation.y += dx * 0.008;
    cube.rotation.x += dy * 0.008;
    cube.rotation.x = THREE.MathUtils.clamp(cube.rotation.x, -Math.PI * 0.48, Math.PI * 0.48);
  });
  function endDrag() { dragging = false; }
  renderer.domElement.addEventListener('pointerup', endDrag);
  renderer.domElement.addEventListener('pointercancel', endDrag);
  renderer.domElement.addEventListener('wheel', (event) => {
    event.preventDefault();
    zoom = THREE.MathUtils.clamp(zoom * Math.exp(event.deltaY * 0.001), 0.72, 2.4);
    updateCameraDistance();
  }, { passive: false });
  renderer.domElement.addEventListener('contextmenu', (event) => event.preventDefault());

  let running = true;
  let animationId = 0;

  function animate() {
    if (!running) return;
    animationId = requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.25);
    accumulator += dt;
    while (accumulator >= step) {
      if (!dragging) cube.rotation.y += step * 0.16;
      accumulator -= step;
    }
    renderer.render(scene, camera);

    sampleTime += dt;
    sampleFrames++;
    if (sampleTime >= 2) {
      const fps = sampleFrames / sampleTime;
      if (!lowQuality && fps < 50) {
        lowQuality = true;
        renderer.shadowMap.enabled = false;
        renderer.setPixelRatio(1);
        renderer.setSize(width, height, false);
      } else if (lowQuality && fps > 58) {
        lowQuality = false;
        renderer.shadowMap.enabled = true;
        renderer.setPixelRatio(pixelRatioCap);
        renderer.setSize(width, height, false);
      }
      sampleTime = 0;
      sampleFrames = 0;
    }
  }

  function onVisibilityChange() {
    if (document.hidden) {
      running = false;
      cancelAnimationFrame(animationId);
      clock.stop();
    } else if (!running) {
      running = true;
      clock.start();
      accumulator = 0;
      animate();
    }
  }
  document.addEventListener('visibilitychange', onVisibilityChange);
  clock.start();
  animate();

  window.addEventListener('pagehide', () => {
    running = false;
    cancelAnimationFrame(animationId);
    resizeObserver.disconnect();
    geometry.dispose();
    stoneTexture.dispose();
    for (const material of materials) material.dispose();
    renderer.dispose();
  }, { once: true });
})();
</script>
</body>
